[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hoare-ai"
version = "0.2.0"
description = "Local-first intelligent code quality and risk reviewer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "pydantic>=2.9",
  "pandas>=2.2",
  "gradio>=5.35,<7",
  "google-genai>=2.0.0",
  "google-cloud-bigquery>=3.44.0",
]

[project.scripts]
hoare = "hoare.cli:main"

[project.optional-dependencies]
local-model = [
  "torch>=2.6",
  "transformers>=5.2.0",
  "accelerate>=1.12.0",
  "safetensors>=0.5.0",
]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["hoare"]
